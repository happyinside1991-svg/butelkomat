<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butelkomat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="machine">
    <h1>♻️ BUTELKOMAT</h1>

    <div id="status">
      🧴<br>
      OCZEKUJĘ NA BUTELKĘ
    </div>

    <div class="stats">
      <div>
        Butelki<br>
        <b id="count">0</b>
      </div>

      <div>
        Kaucja<br>
        <b id="money">0,00 zł</b>
      </div>
    </div>

    <input id="code" placeholder="Kod kreskowy">

    <button onclick="scan()">
      🔎 SPRAWDŹ KOD
    </button>
  </div>

  <script src="script.js"></script>

</body>
</html>
