<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Butelkomat</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 25px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    input {
      width: 90%;
      padding: 15px;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid #aaa;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    button {
      padding: 15px 22px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px;
    }

    #status {
      margin: 20px 0;
      font-size: 24px;
      font-weight: bold;
    }

    #count {
      font-size: 35px;
      font-weight: bold;
    }

    #money {
      font-size: 35px;
      font-weight: bold;
    }

    /* =========================
       BON
       ========================= */

    #receipt {
      display: block;
      margin: 30px auto;
      padding: 20px;
      max-width: 400px;
      background: white;
      border: 2px dashed #333;
      text-align: left;
      box-sizing: border-box;
    }

    #receipt h2 {
      text-align: center;
    }

    #receiptTotalBig {
      text-align: center;
      font-size: 35px;
      font-weight: bold;
      margin-top: 20px;
    }


    /* =========================
       DRUKOWANIE
       ========================= */

    @media print {

      body {
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
        visibility: hidden !important;
      }

      #receipt {
        visibility: visible !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 15px !important;
        border: none !important;
      }

      #receipt * {
        visibility: visible !important;
      }
    }

  </style>
</head>


<body>

  <div class="box">

    <h1>♻️ BUTELKOMAT</h1>

    <input
      id="code"
      type="text"
      inputmode="numeric"
      placeholder="Wpisz kod kreskowy"
    >

    <br>

    <button onclick="scan()">
      🔎 SPRAWDŹ KOD
    </button>

    <div id="status">
      GOTOWY
    </div>

    <div>
      Butelki:
      <span id="count">0</span>
    </div>

    <div>
      Kaucja:
      <span id="money">0,00 zł</span>
    </div>


    <!-- BON -->

    <div id="receipt">

      <h2>🧾 BON BUTELKOMATU</h2>

      <p>
        Liczba butelek:
        <strong id="receiptCount">0</strong>
      </p>

      <p>
        Kaucja:
        <strong id="receiptTotal">0,00 zł</strong>
      </p>

      <p>
        Data:
        <span id="receiptDate">-</span>
      </p>

      <div id="receiptTotalBig">
        0,00 zł
      </div>

    </div>


    <button onclick="drukujBon()">
      🖨️ DRUKUJ BON
    </button>

  </div>
