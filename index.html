
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butelkomat</title>
  <link rel="stylesheet" href="style.css">

  <style>
    #receipt{display:none}
    @media print{
      body>*{display:none!important}
      #receipt{display:block!important}
    }
  </style>
</head>

<body>

  <div class="machine">
    <h1>♻️ BUTELKOMAT</h1>

    <div id="status">
      🧴<br>
      OCZEKUJĘ NA BUTELKĘ
    </div>

    <div class="stats">
      <div>
        Butelki<br>
        <b id="count">0</b>
      </div>

      <div>
        Kaucja<br>
        <b id="money">0,00 zł</b>
      </div>
    </div>

    <input id="code" placeholder="Kod kreskowy">

    <button onclick="scan()">
      🔎 SPRAWDŹ KOD
    </button>
  </div>

  <button id="printReceipt" onclick="drukujBon()">
    DRUKUJ BON
  </button>

  <div id="receipt">

    <div class="receipt-divider">
      --------------------------------
    </div>

    <div class="receipt-row">
      <span>OPAKOWANIA</span>
      <strong>
        <span id="receiptCount">0</span> szt.
      </strong>
    </div>

    <div class="receipt-row">
      <span>KAUCJA</span>
      <strong>
        <span id="receiptTotal">0,00 zł</span>
      </strong>
    </div>

    <div class="receipt-divider">
      --------------------------------
    </div>

    <div class="receipt-big">
      <span>DO ODBIORU</span>
      <strong>
        <span id="receiptTotalBig">0,00 zł</span>
      </strong>
    </div>

    <div class="receipt-divider">
      --------------------------------
    </div>

    <p class="receipt-date">
      Data: <span id="receiptDate"></span>
    </p>

    <p class="receipt-thanks">
      DZIĘKUJEMY!<br>
      ZA ZWROT OPAKOWAŃ ♻
    </p>

    <p class="receipt-footer">
      Zachowaj bon do realizacji kaucji.
    </p>

  </div>

  <script src="script.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3LTJdwswsJne4r4ZZkjKU0t0jo3U2ls0",
      authDomain: "butelkomat-89cc1.firebaseapp.com",
      projectId: "butelkomat-89cc1",
      storageBucket: "butelkomat-89cc1.firebasestorage.app",
      messagingSenderId: "299153464601",
      appId: "1:299153464601:web:8a79bc31882d01e4e03988",
      measurementId: "G-MC97HBNXVF"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>

</body>
</html>
