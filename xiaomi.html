<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaner Butelkomatu</title>

  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      font-size: 26px;
    }

    #reader {
      width: 100%;
      max-width: 700px;
      margin: 15px auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
    }

    button {
      padding: 14px 22px;
      margin: 6px;
      font-size: 19px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    #result {
      margin: 15px;
      font-size: 21px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📱 SKANER BUTELKOMATU</h1>

  <button id="start">
    📷 URUCHOM APARAT
  </button>

  <button id="switchCamera" disabled>
    🔄 PRZEŁĄCZ KAMERĘ
  </button>

  <div id="reader"></div>

  <div id="result">
    Naciśnij „URUCHOM APARAT”
  </div>


  <script src="https://unpkg.com/html5-qrcode"></script>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyD3LTJdwswsJne4r4ZZkjKU0t0jo3U2ls0",
      authDomain: "butelkomat-89cc1.firebaseapp.com",
      projectId: "butelkomat-89cc1",
      storageBucket: "butelkomat-89cc1.firebasestorage.app",
      messagingSenderId: "299153464601",
      appId: "1:299153464601:web:8a79bc31882d01e4e03988",
      measurementId: "G-MC97HBNXVF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const machineRef =
      doc(db, "butelkomat", "machine");


    const codes = [
      "5900541012638",
      "5902768153675",
      "5902078000508",
      "5900699111481",
      "5908027130111"
    ];


    let scanner = null;
    let cameras = [];
    let cameraIndex = 0;

    let zablokowany = false;
    let uruchomiony = false;

    let audioContext = null;


    // 🔊 JEDNO PIP
    function pip() {

      if (!audioContext) return;

      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      osc.type = "square";
      osc.frequency.value = 1200;
      gain.gain.value = 0.35;

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();

      osc.stop(
        audioContext.currentTime + 0.12
      );
    }


    // 🔊 DWA PIP
    function dwaPipy() {

      pip();

      setTimeout(() => {
        pip();
      }, 180);
    }


    // 📤 FIREBASE
    async function wyslijKod(code, poprawny) {

      try {

        await setDoc(machineRef, {
          code: code,
          poprawny: poprawny,
          time: Date.now()
        });

      } catch (error) {

        console.error(error);

      }
    }


    // 📷 SKAN
    function onScanSuccess(decodedText) {

      if (zablokowany) return;

      zablokowany = true;

      const code = decodedText.trim();

      const poprawny =
        codes.includes(code);


      if (poprawny) {

        pip();

        document.getElementById("result").textContent =
          "🟢 PRAWIDŁOWA BUTELKA — PIP!";

      } else {

        dwaPipy();

        document.getElementById("result").textContent =
          "🔴 NIEPRAWIDŁOWA BUTELKA — PIP PIP!";

      }


      wyslijKod(code, poprawny);


      setTimeout(() => {

        zablokowany = false;

        document.getElementById("result").textContent =
          "📷 GOTOWY — ZESKANUJ NASTĘPNĄ BUTELKĘ";

      }, 3000);
    }


    // 📷 URUCHOM KAMERĘ
    async function startCamera(cameraId) {

      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      if (scanner.isScanning) {
        await scanner.stop();
      }

      await scanner.start(
        cameraId,

        {
          fps: 20,

          qrbox: {
            width: 550,
            height: 250
          },

          aspectRatio: 1.7777778,

          formatsToSupport: [

            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.QR_CODE

          ]
        },

        onScanSuccess,

        function () {}

      );

      document.getElementById("result").textContent =
        "📷 GOTOWY — KAMERA " +
        (cameraIndex + 1);
    }


    // ▶️ START
    document.getElementById("start").onclick =
      async function () {

        if (uruchomiony) return;

        try {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

          await audioContext.resume();

        } catch (e) {}

        document.getElementById("result").textContent =
          "📷 URUCHAMIANIE...";


        try {

          cameras =
            await Html5Qrcode.getCameras();


          if (!cameras.length) {
            throw new Error("Brak kamer");
          }


          // Najpierw próbujemy znaleźć tylną kamerę
          let tylna = cameras.findIndex(camera =>
            /back|rear|environment|tyl/i.test(
              camera.label
            )
          );


          if (tylna >= 0) {
            cameraIndex = tylna;
          } else {
            cameraIndex = 0;
          }


          await startCamera(
            cameras[cameraIndex].id
          );


          uruchomiony = true;

          document.getElementById("switchCamera")
            .disabled = false;


        } catch (error) {

          console.error(error);

          document.getElementById("result").textContent =
            "❌ NIE MOŻNA URUCHOMIĆ APARATU";

        }
      };


    // 🔄 PRZEŁĄCZ KAMERĘ
    document.getElementById("switchCamera")
      .onclick = async function () {

        if (!cameras.length) return;

        try {

          cameraIndex++;

          if (cameraIndex >= cameras.length) {
            cameraIndex = 0;
          }

          document.getElementById("result").textContent =
            "🔄 ZMIANA KAMERY...";

          await startCamera(
            cameras[cameraIndex].id
          );

        } catch (error) {

          console.error(error);

          document.getElementById("result").textContent =
            "❌ NIE MOŻNA ZMIENIĆ KAMERY";

        }
      };

  </script>

</body>
</html>
