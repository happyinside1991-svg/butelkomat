<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaner Butelkomatu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #result {
      font-size: 22px;
      margin: 20px;
      font-weight: bold;
    }

    button {
      font-size: 20px;
      padding: 12px 20px;
      margin: 10px;
    }
  </style>
</head>

<body>

  <h1>📱 SKANER BUTELKOMATU</h1>

  <button id="start">
    📷 URUCHOM APARAT
  </button>

  <div id="reader"></div>

  <div id="result">
    Naciśnij „URUCHOM APARAT”
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyD3LTJdwswsJne4r4ZZkjKU0t0jo3U2ls0",
      authDomain: "butelkomat-89cc1.firebaseapp.com",
      projectId: "butelkomat-89cc1",
      storageBucket: "butelkomat-89cc1.firebasestorage.app",
      messagingSenderId: "299153464601",
      appId: "1:299153464601:web:8a79bc31882d01e4e03988",
      measurementId: "G-MC97HBNXVF"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const machineRef =
      doc(db, "butelkomat", "machine");


    let skanZablokowany = false;
    let scanner = null;


    async function wyslijKod(code) {

      document.getElementById("result").textContent =
        "📤 Wysyłanie: " + code;

      try {

        await setDoc(machineRef, {
          code: code,
          time: Date.now()
        });

        document.getElementById("result").textContent =
          "✅ Wysłano: " + code;

      } catch (error) {

        console.error(error);

        document.getElementById("result").textContent =
          "❌ Błąd wysyłania";

      }
    }


    function onScanSuccess(decodedText) {

      // BLOKADA DLA WSZYSTKICH KODÓW
      if (skanZablokowany) return;

      skanZablokowany = true;

      wyslijKod(decodedText);

      setTimeout(() => {

        skanZablokowany = false;

        document.getElementById("result").textContent =
          "📷 Możesz zeskanować następną butelkę";

      }, 3000);
    }


    document.getElementById("start").addEventListener(
      "click",
      async () => {

        document.getElementById("result").textContent =
          "📷 Uruchamianie aparatu...";

        try {

          scanner = new Html5Qrcode("reader");

          const cameras =
            await Html5Qrcode.getCameras();

          if (!cameras || cameras.length === 0) {

            document.getElementById("result").textContent =
              "❌ Nie znaleziono aparatu";

            return;
          }


          // Szukamy tylnej kamery
          let cameraId = cameras[0].id;

          const tylna =
            cameras.find(camera =>
              /back|rear|environment|tyl/i.test(
                camera.label
              )
            );

          if (tylna) {
            cameraId = tylna.id;
          }


          await scanner.start(
            cameraId,

            {
              fps: 10,

              qrbox: {
                width: 300,
                height: 150
              }
            },

            onScanSuccess,

            () => {}
          );


          document.getElementById("result").textContent =
            "📷 Aparat działa — zeskanuj kod";


        } catch (error) {

          console.error(error);

          document.getElementById("result").textContent =
            "❌ Nie można uruchomić aparatu. Sprawdź zgodę na aparat.";

        }

      }
    );

  </script>

</body>
</html>
