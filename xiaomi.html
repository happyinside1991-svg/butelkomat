<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaner Butelkomatu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #result {
      font-size: 24px;
      margin: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📱 SKANER BUTELKOMATU</h1>

  <div id="reader"></div>

  <div id="result">
    Czekam na kod...
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3LTJdwswsJne4r4ZZkjKU0t0jo3U2ls0",
      authDomain: "butelkomat-89cc1.firebaseapp.com",
      projectId: "butelkomat-89cc1",
      storageBucket: "butelkomat-89cc1.firebasestorage.app",
      messagingSenderId: "299153464601",
      appId: "1:299153464601:web:8a79bc31882d01e4e03988",
      measurementId: "G-MC97HBNXVF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const machineRef =
      doc(db, "butelkomat", "machine");

    let skanZablokowany = false;

    async function wyslijKod(code) {

      document.getElementById("result").textContent =
        "📤 Wysyłanie: " + code;

      await setDoc(machineRef, {
        code: code,
        time: Date.now()
      });

      document.getElementById("result").textContent =
        "✅ Wysłano: " + code;
    }

    function onScanSuccess(decodedText) {

      if (skanZablokowany) return;

      skanZablokowany = true;

      wyslijKod(decodedText);

      setTimeout(() => {
        skanZablokowany = false;

        document.getElementById("result").textContent =
          "📷 Możesz zeskanować następną butelkę";

      }, 3000);
    }

    function onScanFailure(error) {
      // Czekamy na prawidłowy kod
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 300,
          height: 150
        }
      },
      false
    );

    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
